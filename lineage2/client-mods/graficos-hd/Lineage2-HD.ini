# Preset de ReShade para Lineage 2 — "Lineage2-HD"
# Copiar a la carpeta system/ del cliente y seleccionarlo en ReShade (tecla Inicio).
# Orden de efectos pensado para nitidez sin artefactos: AA -> contraste -> color -> sharpen.

PreprocessorDefinitions=
Techniques=SMAA,Clarity,FakeHDR,Vibrance,LumaSharpen
TechniqueSorting=SMAA,Clarity,FakeHDR,Vibrance,LumaSharpen

[SMAA.fx]
EdgeDetectionType=1
EdgeDetectionThreshold=0.100000
MaxSearchSteps=24
MaxSearchStepsDiagonal=12
CornerRounding=25

[Clarity.fx]
ClarityRadius=3
ClarityOffset=2.000000
ClarityBlendMode=2
ClarityBlendIfDark=50
ClarityBlendIfLight=205
ClarityStrength=0.400000
ClarityDarkIntensity=0.400000
ClarityLightIntensity=0.000000

[FakeHDR.fx]
HDRPower=1.100000
radius1=0.793000
radius2=0.870000

[Vibrance.fx]
Vibrance=0.150000
VibranceRGBBalance=1.000000,1.000000,1.000000

[LumaSharpen.fx]
pattern=1
sharp_strength=0.900000
sharp_clamp=0.035000
offset_bias=1.000000
show_sharpen=0
